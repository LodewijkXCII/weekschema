services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: weekplanner
      POSTGRES_PASSWORD: weekplanner
      POSTGRES_DB: weekplanner
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./docker/init-pgcrypto.sql:/docker-entrypoint-initdb.d/init-pgcrypto.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekplanner -d weekplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Binnen het compose-netwerk heet de db-service "db", niet "localhost".
      DATABASE_URL: postgres://weekplanner:weekplanner@db:5432/weekplanner
    ports:
      # Bewust op alle interfaces (dus ook het LAN) i.p.v. alleen localhost:
      # de Twingate-connector routeert verkeer op basis van het LAN-adres
      # van de Pi, niet via een eigen virtuele interface zoals Tailscale dat
      # deed -- 127.0.0.1 is voor extern verkeer niet onderscheppbaar. Nog
      # steeds niet publiek: alleen bereikbaar binnen je eigen thuisnetwerk,
      # plus via Twingate voor toestellen daarbuiten.
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Twingate-connector: legt een uitgaande verbinding met Twingate's control
  # plane (geen inkomende poorten nodig, werkt achter NAT). network_mode:
  # host zodat 'ie de app hierboven via de Pi's eigen LAN-adres kan
  # bereiken. Tokens komen uit .env, gegenereerd bij het aanmaken van dit
  # Remote Network in de Twingate admin console (zie DEPLOY.md).
  twingate-connector:
    image: twingate/connector:latest
    restart: unless-stopped
    network_mode: host
    # Geen `sysctls:` hier -- met network_mode: host deelt de container de
    # ECHTE netwerk-namespace van de Pi, en Docker weigert dan sysctls te
    # zetten (die zouden de host zelf raken, niet een geïsoleerde namespace).
    # net.ipv4.ping_group_range is puur voor Twingate's ICMP-ping-diagnostiek,
    # niet nodig voor de tunnel zelf. Wil je 'm alsnog: zet 'm op de Pi zelf
    # (`sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"`, evt.
    # persistent via /etc/sysctl.d/).
    environment:
      TWINGATE_NETWORK: ${TWINGATE_NETWORK}
      TWINGATE_ACCESS_TOKEN: ${TWINGATE_ACCESS_TOKEN}
      TWINGATE_REFRESH_TOKEN: ${TWINGATE_REFRESH_TOKEN}
      TWINGATE_LOG_ANALYTICS: v2

volumes:
  pgdata_prod:
