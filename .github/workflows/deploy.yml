name: Deploy

on:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npx nuxt prepare
      - run: npx nuxt typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      # Legt een tijdelijke, uitgaande verbinding met je Twingate-netwerk --
      # geen inkomende poorten nodig op de Pi, werkt ook achter NAT. De
      # runner krijgt hiermee toegang tot de Resources die aan deze Service
      # Account zijn toegewezen (zie DEPLOY.md) -- in dit geval de Pi op
      # poort 22 voor de SSH-stap hieronder.
      - name: Verbind met Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: bash /opt/weekschema/deploy.sh
